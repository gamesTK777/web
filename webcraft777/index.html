<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142d30">
  <meta name="description" content="素材を集めて道具を作り、家を建てる3Dゲーム。ひとりでも、最大6人のオンラインマルチプレイでも遊べます。">
  <title>ウェブクラフト777 | TK777 ARCADE</title>
  <link rel="icon" href="./art/icon.webp" type="image/webp">
  <link rel="stylesheet" href="./style.css">
  <script defer src="https://gamestk777.github.io/web/shared/site-analytics.js?v=1" data-page="webcraft-play"></script>
</head>
<body>
  <main id="game">
    <canvas id="scene" tabindex="-1" aria-label="3Dワールドのゲーム画面"></canvas>
    <div id="cover" aria-hidden="true"></div>
    <section id="overlay" class="overlay" aria-label="ゲーム画面"></section>
    <section id="hud" aria-label="プレイ情報" hidden>
      <div class="play-top">
        <div id="mode-tag"></div>
        <div class="top-actions">
          <button type="button" id="view-mode" data-action="view-mode" aria-label="オリジナルモードとキッズモードの切り替え" aria-pressed="false" title="視点モードを切り替え（K）"><span>オリジナルモード</span> <kbd aria-hidden="true">K</kbd></button>
          <button type="button" id="tag-map-toggle" data-action="tag-map" aria-controls="tag-map" aria-pressed="false" title="エリア地図を開く・閉じる（M）" hidden>地図 <kbd aria-hidden="true">M</kbd></button>
          <button type="button" data-action="inventory" title="持ち物を開く（E）">持ち物 <kbd>E</kbd></button>
          <button type="button" data-action="pause" title="一時停止（Esc）">一時停止 <kbd>Esc</kbd></button>
        </div>
      </div>
      <div id="online-hud" role="status" hidden>ルーム <strong id="online-hud-code"></strong><span id="online-hud-status"></span><span id="online-hud-stage" hidden></span></div>
      <div id="tag-status" hidden>
        <div id="tag-clock" role="timer" aria-live="off" aria-label="残り時間" hidden><span aria-hidden="true">残り</span><time id="tag-clock-value"></time></div>
        <strong id="tag-role" role="status"></strong><span id="tag-hint"></span>
      </div>
      <aside id="tag-map" aria-label="鬼ごっこのエリア地図" hidden>
        <div class="tag-map-head"><strong>エリア地図</strong><span id="tag-map-level" hidden></span><span>↑ 北</span></div>
        <canvas id="tag-map-canvas" width="384" height="384" role="img" aria-label="地形、自分のエリア、他の参加者のエリアごとの人数"></canvas>
        <div class="tag-map-legend"><span><i class="tag-map-self" aria-hidden="true"></i> 自分のエリア</span><span><i class="tag-map-people" aria-hidden="true">2</i> 他の参加者の人数</span></div>
      </aside>
      <div id="life-status" hidden>
        <label>体力 <progress id="life-health" max="100" value="100"></progress><span id="life-health-number">100</span></label>
        <label id="shark-status" hidden>サメ <progress id="shark-health" max="100" value="100"></progress><span id="shark-health-number">100</span></label>
      </div>
      <div id="guide" hidden></div>
      <div class="trail"><span id="bearing"></span><span id="journey" hidden></span></div>
      <div id="target-hint" hidden></div>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="mine-meter" role="progressbar" aria-label="採掘の進み具合" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div>
      <div id="touch-controls" role="group" aria-label="タッチ操作" hidden>
        <div id="move-stick" role="group" aria-label="ドラッグして移動">
          <span class="stick-direction stick-up" aria-hidden="true">▲</span>
          <span class="stick-direction stick-right" aria-hidden="true">▶</span>
          <span class="stick-direction stick-down" aria-hidden="true">▼</span>
          <span class="stick-direction stick-left" aria-hidden="true">◀</span>
          <div id="move-stick-knob" aria-hidden="true"></div>
        </div>
        <div id="touch-actions">
          <button type="button" id="touch-fly" data-action="touch-fly" aria-label="飛行を切り替える" aria-pressed="false" hidden>飛行</button>
          <button type="button" id="touch-down" title="長押ししてしゃがむ。飛行中は下降">しゃがむ</button>
          <button type="button" id="touch-jump" title="ジャンプ。水中や飛行中は長押しで上昇">ジャンプ</button>
        </div>
      </div>
      <button id="park-ride" data-action="park-ride" type="button" hidden>乗る</button>
      <div id="fallback" hidden><span>ドラッグで視点を変更</span><div><button id="touch-attack" data-action="attack-shark" type="button" hidden>攻撃</button><button id="touch-rotate" data-action="rotate-material" type="button" aria-label="滑り台の下り方向を切り替える" hidden>向き</button><button data-hold="mine" title="押し続けて採掘">採掘</button><button data-action="place">設置</button></div></div>
      <div class="belt"><p id="equipped"></p><div class="hotbar" id="hud-bar" role="group" aria-label="ホットバー"></div></div>
    </section>
    <div id="tag-hide" hidden>
      <div class="tag-hide-card">
        <p class="tag-hide-label">隠れる時間</p>
        <p id="tag-hide-title" role="status" aria-atomic="true"></p>
        <div class="tag-hide-clock" role="timer" aria-live="off" aria-label="隠れる時間の残り秒数">
          <time id="tag-hide-count"></time><span aria-hidden="true">秒</span>
        </div>
        <p id="tag-hide-detail"></p>
      </div>
    </div>
    <output id="debug" aria-label="描画情報" hidden></output>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="save-status" role="status" aria-live="polite" hidden></div>
  </main>
  <dialog id="confirm-import" aria-labelledby="import-heading">
    <h2 id="import-heading">ワールドを上書きしますか？</h2>
    <p id="confirm-body"></p>
    <form method="dialog" class="actions"><button value="cancel" autofocus>キャンセル</button><button class="danger" value="replace">上書きする</button></form>
  </dialog>
  <noscript>ウェブクラフト777を遊ぶにはブラウザーのJavaScriptを有効にしてください。</noscript>
  <script type="module" src="./src/main.ts"></script>
</body>
</html>
