<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
  <title>建築・復元検証 | ウェブクラフト777</title>
  <style>
    * {box-sizing:border-box} body{margin:0;background:#183237;color:#f7f6eb;font:14px/1.45 system-ui,sans-serif}
    canvas{display:block;width:100vw;height:100vh} aside{position:absolute;left:12px;top:10px;max-width:min(570px,calc(100vw - 24px));border-radius:8px;padding:10px 14px;background:#10292dee}
    [hidden]{display:none!important}header,nav{display:flex;flex-wrap:wrap;gap:6px;align-items:center} h1{margin:0;font-size:1.05rem}
    button,.export{font:inherit;color:inherit;background:#2b494d;border:1px solid #91a99a;border-radius:4px;padding:4px 8px;cursor:pointer;text-decoration:none}
    #go{background:#355848} button[aria-pressed=true]{background:#eed095;color:#213c3c;border-color:#eed095}
    output{display:block;color:#bce9cd;margin:4px 0} details{font-size:12px}summary{cursor:pointer}#status{margin:4px 0}
    #meter{position:absolute;bottom:12px;right:12px;padding:4px 8px;color:#f2f3eb;background:#142f30cc;font-size:12px}
  </style>
</head>
<body>
  <canvas id="view" aria-label="検証ワールド"></canvas>
  <aside><header><h1>建築・復元検証</h1><button id="go">3場面を準備する</button></header>
    <output id="status">テスト用領域で新しいワールドを生成します。</output>
    <nav id="shots" hidden>
      <button data-shot="start">開始地点</button><button data-shot="construction">建築中</button>
      <button data-shot="evening">完成・夕方</button><a class="export" id="backup" download="webcraft777-test-cottage.json">家のバックアップ</a>
    </nav>
    <details id="details" hidden><summary>検証結果を表示</summary><p id="proof"></p></details>
  </aside>
  <div id="meter"></div>
  <script type="module" src="./scenario.ts"></script>
</body></html>
