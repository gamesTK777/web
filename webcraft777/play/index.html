<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#142d30">
  <meta name="description" content="素材を集めて道具を作り、自分のワールドに家を建てる一人用3Dゲーム。">
  <title>ウェブクラフト777 | TK777 ARCADE</title>
  <link rel="icon" href="./art/icon.webp" type="image/webp">
  <script type="module" crossorigin src="./assets/index-ByiuiJPr.js"></script>
  <link rel="stylesheet" crossorigin href="./assets/index-B8-PUOJ0.css">
</head>
<body>
  <main id="game">
    <canvas id="scene" tabindex="-1" aria-label="3Dワールドのゲーム画面"></canvas>
    <div id="cover" aria-hidden="true"></div>
    <section id="overlay" class="overlay" aria-label="ゲーム画面"></section>
    <section id="hud" aria-label="プレイ情報" hidden>
      <div class="play-top">
        <div id="mode-tag"></div>
        <div class="top-actions">
          <button type="button" id="view-mode" data-action="view-mode" aria-label="オリジナルモードとキッズモードの切り替え" aria-pressed="false" title="視点モードを切り替え（K）"><span>オリジナルモード</span> <kbd aria-hidden="true">K</kbd></button>
          <button type="button" data-action="inventory" title="持ち物を開く（E）">持ち物 <kbd>E</kbd></button>
          <button type="button" data-action="pause" title="一時停止（Esc）">一時停止 <kbd>Esc</kbd></button>
        </div>
      </div>
      <div id="online-hud" role="status" hidden>ルーム <strong id="online-hud-code"></strong><span id="online-hud-status"></span></div>
      <div id="guide" hidden></div>
      <div class="trail"><span id="bearing"></span><span id="journey" hidden></span></div>
      <div id="target-hint" hidden></div>
      <div id="crosshair" aria-hidden="true"></div>
      <div id="mine-meter" role="progressbar" aria-label="採掘の進み具合" aria-valuemin="0" aria-valuemax="100" hidden><i></i></div>
      <div id="touch-controls" role="group" aria-label="タッチ操作" hidden>
        <div id="move-stick" role="group" aria-label="ドラッグして移動">
          <span class="stick-direction stick-up" aria-hidden="true">▲</span>
          <span class="stick-direction stick-right" aria-hidden="true">▶</span>
          <span class="stick-direction stick-down" aria-hidden="true">▼</span>
          <span class="stick-direction stick-left" aria-hidden="true">◀</span>
          <div id="move-stick-knob" aria-hidden="true"></div>
        </div>
        <div id="touch-actions">
          <button type="button" id="touch-fly" data-action="touch-fly" aria-label="飛行を切り替える" aria-pressed="false" hidden>飛行</button>
          <button type="button" id="touch-down" title="長押ししてしゃがむ。飛行中は下降">しゃがむ</button>
          <button type="button" id="touch-jump" title="ジャンプ。水中や飛行中は長押しで上昇">ジャンプ</button>
        </div>
      </div>
      <div id="fallback" hidden><span>ドラッグで視点を変更</span><div><button data-hold="mine" title="押し続けて採掘">採掘</button><button data-action="place">設置</button></div></div>
      <div class="belt"><p id="equipped"></p><div class="hotbar" id="hud-bar" role="group" aria-label="ホットバー"></div></div>
    </section>
    <output id="debug" aria-label="描画情報" hidden></output>
    <div id="notice" role="status" aria-live="polite" hidden></div>
    <div id="save-status" role="status" aria-live="polite" hidden></div>
  </main>
  <dialog id="confirm-import" aria-labelledby="import-heading">
    <h2 id="import-heading">ワールドを上書きしますか？</h2>
    <p id="confirm-body"></p>
    <form method="dialog" class="actions"><button value="cancel" autofocus>キャンセル</button><button class="danger" value="replace">上書きする</button></form>
  </dialog>
  <noscript>ウェブクラフト777を遊ぶにはブラウザーのJavaScriptを有効にしてください。</noscript>
</body>
</html>
