<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0">
<title>🌸 はなばたけマインスイーパー 🌸</title>
<link rel="stylesheet" href="style.css">
</head>
<body>
<header class="wrap">
  <div class="brand-row">
    <div class="brand-mark" aria-hidden="true">✿</div>
    <div class="brand-copy">
      <div class="logo-sub">TK777 ARCADE / BLOOMFIELD</div>
      <h1 class="logo">はなばたけ<br class="mobile-break"><span>マインスイーパー</span></h1>
      <p>地雷をよけて、花を咲かせよう。</p>
    </div>
    <button class="top-ranking" type="button" onclick="showMinesweeperRanking()">🏆 TOP 10</button>
  </div>
</header>

<main class="game-layout wrap">
<div class="game-controls">

  <section class="control-panel" aria-label="難易度選択">
    <div class="section-label"><span>難易度を選ぶ</span><span>最初の1手は安全</span></div>
    <div class="diff-row">
      <button class="diff-btn active" type="button" data-diff="easy" onclick="setDiff('easy')">🌱 かんたん</button>
      <button class="diff-btn" type="button" data-diff="medium" onclick="setDiff('medium')">🌿 ふつう</button>
      <button class="diff-btn" type="button" data-diff="hard" onclick="setDiff('hard')">🌵 むずかしい</button>
      <button class="diff-btn" type="button" data-diff="custom" onclick="setDiff('custom')">⚙ カスタム</button>
    </div>
    <div id="custom-panel">
      <label>横 <input type="number" id="cw" value="12" min="5" max="30"></label>
      <label>縦 <input type="number" id="ch" value="12" min="5" max="24"></label>
      <label>地雷 <input type="number" id="cm" value="20" min="1" max="500"></label>
      <button class="btn-apply" type="button" onclick="applyCustom()">この盤面で遊ぶ</button>
    </div>
  </section>

  <div class="hud">
    <div class="hud-badge mine-badge">
      <span class="label">💣 残りの地雷</span>
      <span class="value" id="hud-mines">10</span>
    </div>
    <button id="face-btn" type="button" onclick="newGame()" title="新しいゲームを始める"><span class="face-icon" id="face-icon">😊</span><span class="face-text">新しいゲーム</span></button>
    <div class="hud-badge time-badge">
      <span class="label">⏱ クリアタイム</span>
      <span class="value" id="hud-time">0:00</span>
    </div>
  </div>
  <div class="best-badge" id="best-disp" style="display:none">🏅 ノーヒント自己ベスト: <span id="best-time">-</span></div>

<section class="feature-panel" aria-label="プレイ補助">
  <div class="progress-head"><span>安全なマスの開放</span><div class="chain-badge">✨ 最大連鎖 <strong id="chain-count">0</strong></div><strong id="progress-count">0 / 71</strong></div>
  <div class="progress-track" aria-hidden="true"><div id="progress-fill"></div></div>
  <div class="action-row">
    <button id="flag-toggle" type="button" aria-pressed="false" onclick="toggleFlagMode()">🚩 旗モード OFF</button>
    <button id="hint-btn" type="button" onclick="useHint()" disabled>💡 安全ヒント <strong id="hint-count">2</strong></button>
  </div>
  <p class="howto">タップで開く · 長押し／右クリックで旗 · 数字タップで周囲を開く</p>
  <p id="game-toast" role="status" aria-live="polite"></p>
</section>
</div>

<div id="board-wrap">
  <div id="board"></div>
</div>
</main>

<!-- Win overlay -->
<div class="overlay" id="win-ov">
  <div class="ov-card">
    <div class="ov-icon">🎉</div>
    <div class="stars" id="win-stars">⭐⭐⭐</div>
    <div class="ov-title">クリア！おめでとう！</div>
    <div class="ov-sub" id="win-mode">花畑を守りきった！</div>
    <div class="ov-stats">
      <div class="ov-stat"><div class="sv" id="ws-time">0:00</div><div class="sk">タイム</div></div>
      <div class="ov-stat"><div class="sv" id="ws-moves">0</div><div class="sk">クリック数</div></div>
      <div class="ov-stat"><div class="sv" id="ws-mines">0</div><div class="sk">地雷数</div></div>
    </div>
    <div class="win-actions">
      <button class="ov-btn" onclick="openMinesweeperWinRanking()">🏆 記録・TOP10</button>
      <button class="ov-btn" onclick="newGame(); closeOv('win-ov')">🌸 もう一度</button>
    </div>
  </div>
</div>

<!-- Lose overlay -->
<div class="overlay" id="lose-ov">
  <div class="ov-card">
    <div class="ov-icon">💥</div>
    <div class="ov-title">ドカーン！！</div>
    <div class="ov-sub">地雷を踏んでしまった…またがんばろう！</div>
    <div class="ov-stats">
      <div class="ov-stat"><div class="sv" id="ls-time">0:00</div><div class="sk">経過タイム</div></div>
      <div class="ov-stat"><div class="sv" id="ls-open">0</div><div class="sk">開いたマス</div></div>
    </div>
    <button class="ov-btn" onclick="newGame(); closeOv('lose-ov')">💪 もう一度</button>
  </div>
</div>

<script src="../shared/leaderboard.js"></script>
<script>
// ============================================================
//   CONFIG
// ============================================================
const PRESETS = {
  easy:   { w:9,  h:9,  m:10 },
  medium: { w:16, h:16, m:40 },
  hard:   { w:30, h:16, m:99 },
};
const FLOWERS = ['🌸','🌺','🌼','🌷','🍀','🌻','🌹','💮'];

// ============================================================
//   STATE
// ============================================================
let cfg = { ...PRESETS.easy };
let curDiff = 'easy';
let board = [];   // 2D: {mine,revealed,flagged,question,count}
let state = 'idle'; // idle|playing|won|lost
let firstClick = true;
let clicks = 0;
let flagged = 0;
let seconds = 0;
let timerID = null;
let bestTimes = { easy: Infinity, medium: Infinity, hard: Infinity };
let rankingSessionPromise = Promise.resolve(null);
let assistedSessionPromise = Promise.resolve(null);
let activeRankingMode = 'minesweeper:easy', activeDiff = 'easy';
let roundStartedAt = 0, roundSerial = 0, winRecorded = false;
let lastWinRankingResult = null;
let revealedCount = 0;
let hintUses = 2, hintCell = null, hintTimer = null;
let bestChain = 0, chainTimer = null, toastTimer = null;
let chordCells = [];
let chordTimer = null;
let flagMode = false;
let activeTouchId = null; // track single touch to prevent multi-cell issues

function rankingNow() { return typeof performance !== 'undefined' && performance.now ? performance.now() : Date.now(); }
function startMinesweeperSession(mode) {
  if (!window.TKLeaderboard) return Promise.resolve(null);
  try { return Promise.resolve(TKLeaderboard.start(mode)).catch(() => null); }
  catch { return Promise.resolve(null); }
}
function minesweeperMode() {
  return curDiff === 'custom' ? `minesweeper:custom:${cfg.w}x${cfg.h}:${cfg.m}` : `minesweeper:${curDiff}`;
}
function assistedMode(mode) { return mode.replace(/^minesweeper:/, 'minesweeper:assisted:'); }
function minesweeperModeOptions() {
  const options = [];
  for (const [key, label] of [['easy','かんたん'],['medium','ふつう'],['hard','むずかしい']]) {
    const mode = `minesweeper:${key}`;
    options.push({value:mode,label:`${label}・通常`}, {value:assistedMode(mode),label:`${label}・ヒント使用`});
  }
  if (curDiff === 'custom' || activeRankingMode.startsWith('minesweeper:custom:')) {
    const mode = `minesweeper:custom:${cfg.w}x${cfg.h}:${cfg.m}`;
    const label = `カスタム ${cfg.w}×${cfg.h}・地雷${cfg.m}個`;
    options.push({value:mode,label:`${label}・通常`},
      {value:assistedMode(mode),label:`${label}・ヒント使用`});
  }
  return options;
}
function showMinesweeperRanking() {
  if (window.TKLeaderboard) TKLeaderboard.show({mode:state === 'idle' ? minesweeperMode() : activeRankingMode,
    label:'マインスイーパー',modeOptions:minesweeperModeOptions(),
    note:'クリア時間が短い順。ヒント使用と通常、難易度・カスタム盤面は別ランキングです。'});
  else alert('ランキングを読み込めませんでした。');
}
function openMinesweeperWinRanking() {
  if (lastWinRankingResult && window.TKLeaderboard) TKLeaderboard.open(lastWinRankingResult);
}

// ============================================================
//   DIFFICULTY
// ============================================================
function setDiff(d) {
  document.querySelectorAll('.diff-btn').forEach(b => {
    b.classList.toggle('active', b.dataset.diff === d);
  });
  document.getElementById('custom-panel').style.display = d === 'custom' ? 'flex' : 'none';
  if (d !== 'custom') {
    curDiff = d;
    cfg = { ...PRESETS[d] };
    newGame();
    updateBest();
  }
}

function applyCustom() {
  const w = clamp(parseInt(document.getElementById('cw').value)||9, 5, 30);
  const h = clamp(parseInt(document.getElementById('ch').value)||9, 5, 24);
  const m = clamp(parseInt(document.getElementById('cm').value)||10, 1, w*h - 9);
  curDiff = 'custom';
  cfg = { w, h, m };
  newGame();
  updateBest();
}

function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }

// ============================================================
//   FLAG MODE (mobile)
// ============================================================
function toggleFlagMode() {
  flagMode = !flagMode;
  renderFlagMode();
}
function renderFlagMode() {
  const btn = document.getElementById('flag-toggle');
  btn.textContent = flagMode ? '🚩 旗を置く ON' : '🚩 旗を置く OFF';
  btn.classList.toggle('active', flagMode);
  btn.setAttribute('aria-pressed', String(flagMode));
}

// ============================================================
//   DYNAMIC CELL SIZING
// ============================================================
function adjustCellSize() {
  const vw = window.innerWidth;
  const gap = 3; // CSS gap between cells
  const boardPad = 14 * 2; // padding on board (14px each side)
  const wrapPad = 10 * 2; // padding on board-wrap (10px each side) + wrap (12px each side)
  const outerPad = 24; // extra safety margin
  const availW = vw - boardPad - wrapPad - outerPad;
  const totalGaps = (cfg.w - 1) * gap;
  let cellSize = Math.floor((availW - totalGaps) / cfg.w);
  cellSize = clamp(cellSize, 18, 38); // min 18px, max 38px (default)

  const cellRadius = cellSize >= 32 ? 8 : cellSize >= 26 ? 6 : 5;
  const fontSize = cellSize >= 32 ? '1rem' : cellSize >= 26 ? '0.9rem' : '0.75rem';

  document.documentElement.style.setProperty('--cell-size', cellSize + 'px');
  document.documentElement.style.setProperty('--cell-radius', cellRadius + 'px');
  // Update font size on cells
  document.querySelectorAll('.cell').forEach(c => c.style.fontSize = fontSize);
}

window.addEventListener('resize', () => adjustCellSize());

// ============================================================
//   GAME INIT
// ============================================================
function newGame() {
  clearInterval(timerID);
  clearHintHighlight();
  clearTimeout(chainTimer);
  clearTimeout(toastTimer);
  document.getElementById('board').classList.remove('chain-active');
  document.getElementById('game-toast').textContent = '';
  document.getElementById('game-toast').classList.remove('show');
  roundSerial++;
  winRecorded = false;
  lastWinRankingResult = null;
  roundStartedAt = 0;
  rankingSessionPromise = Promise.resolve(null);
  assistedSessionPromise = Promise.resolve(null);
  activeRankingMode = minesweeperMode();
  activeDiff = curDiff;
  state = 'idle'; firstClick = true; clicks = 0; flagged = 0;
  seconds = 0; revealedCount = 0;
  hintUses = 2; bestChain = 0;
  flagMode = false;
  renderFlagMode();
  document.getElementById('chain-count').textContent = '0';
  clearChordHints();

  setFace('😊');
  document.getElementById('hud-time').textContent = '0:00';
  document.getElementById('hud-mines').textContent = cfg.m;
  updateHintButton();

  // Build empty board
  board = Array.from({length: cfg.h}, () =>
    Array.from({length: cfg.w}, () =>
      ({mine:false, revealed:false, flagged:false, question:false, count:0})
    )
  );

  renderBoard();
  updateProgress();
}

// ============================================================
//   MINE PLACEMENT (first-click safe)
// ============================================================
function placeMines(safeR, safeC) {
  let placed = 0;
  while (placed < cfg.m) {
    const r = Math.floor(Math.random() * cfg.h);
    const c = Math.floor(Math.random() * cfg.w);
    if (board[r][c].mine) continue;
    if (Math.abs(r - safeR) <= 1 && Math.abs(c - safeC) <= 1) continue;
    board[r][c].mine = true;
    placed++;
  }
  // Compute counts
  for (let r = 0; r < cfg.h; r++)
    for (let c = 0; c < cfg.w; c++) {
      if (board[r][c].mine) continue;
      board[r][c].count = neighbors(r, c).filter(([nr,nc]) => board[nr][nc].mine).length;
    }
  state = 'playing';
  activeRankingMode = minesweeperMode();
  activeDiff = curDiff;
  roundStartedAt = rankingNow();
  rankingSessionPromise = startMinesweeperSession(activeRankingMode);
  assistedSessionPromise = startMinesweeperSession(assistedMode(activeRankingMode));
  updateHintButton();
  timerID = setInterval(() => {
    seconds++;
    const m = Math.floor(seconds/60), s = seconds%60;
    document.getElementById('hud-time').textContent = `${m}:${s.toString().padStart(2,'0')}`;
  }, 1000);
}

function updateHintButton() {
  document.getElementById('hint-count').textContent = hintUses;
  document.getElementById('hint-btn').disabled = state !== 'playing' || hintUses === 0;
}

function updateProgress() {
  const total = cfg.w * cfg.h - cfg.m;
  document.getElementById('progress-count').textContent = `${revealedCount} / ${total}`;
  document.getElementById('progress-fill').style.width = `${Math.min(100, revealedCount / total * 100)}%`;
}

function showToast(message) {
  const el = document.getElementById('game-toast');
  el.textContent = message;
  el.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.classList.remove('show'); el.textContent = ''; }, 3500);
}

function clearHintHighlight() {
  clearTimeout(hintTimer);
  if (hintCell) document.getElementById(`c-${hintCell.r}-${hintCell.c}`)?.classList.remove('hint-suggested');
  hintCell = null;
}

function useHint() {
  if (state !== 'playing' || hintUses === 0) return;
  const safe = [], frontier = [];
  for (let r = 0; r < cfg.h; r++) for (let c = 0; c < cfg.w; c++) {
    const cell = board[r][c];
    if (cell.mine || cell.revealed || cell.flagged || cell.question) continue;
    safe.push([r, c]);
    if (neighbors(r, c).some(([nr, nc]) => board[nr][nc].revealed)) frontier.push([r, c]);
  }
  const choices = frontier.length ? frontier : safe;
  if (!choices.length) { showToast('旗や「？」を外すとヒントを使えます。'); return; }
  clearHintHighlight();
  const [r, c] = choices[Math.floor(Math.random() * choices.length)];
  hintUses--;
  activeRankingMode = assistedMode(minesweeperMode());
  rankingSessionPromise = assistedSessionPromise;
  hintCell = { r, c };
  const target = document.getElementById(`c-${r}-${c}`);
  target?.classList.add('hint-suggested');
  target?.scrollIntoView({ block:'nearest', inline:'nearest' });
  hintTimer = setTimeout(clearHintHighlight, 6000);
  updateHintButton();
  showToast('光るマスは安全です。ヒント使用の記録は別ランキングに保存されます。');
}

function recordSafeChain(before) {
  const gained = revealedCount - before;
  updateProgress();
  if (gained < 3) return;
  bestChain = Math.max(bestChain, gained);
  document.getElementById('chain-count').textContent = bestChain;
  const el = document.getElementById('board');
  el.classList.remove('chain-active');
  void el.offsetWidth;
  el.classList.add('chain-active');
  clearTimeout(chainTimer);
  chainTimer = setTimeout(() => el.classList.remove('chain-active'), 700);
  showToast(gained >= 12 ? `✿ BLOOM CHAIN! ${gained}マス開放` : `✨ ${gained}マス連鎖！`);
}

// ============================================================
//   NEIGHBORS
// ============================================================
function neighbors(r, c) {
  const res = [];
  for (let dr = -1; dr <= 1; dr++)
    for (let dc = -1; dc <= 1; dc++) {
      if (!dr && !dc) continue;
      const nr = r+dr, nc = c+dc;
      if (nr >= 0 && nr < cfg.h && nc >= 0 && nc < cfg.w) res.push([nr,nc]);
    }
  return res;
}

// ============================================================
//   RENDER BOARD
// ============================================================
function renderBoard() {
  adjustCellSize();
  const el = document.getElementById('board');
  el.style.gridTemplateColumns = `repeat(${cfg.w}, var(--cell-size))`;
  el.innerHTML = '';

  for (let r = 0; r < cfg.h; r++)
    for (let c = 0; c < cfg.w; c++)
      el.appendChild(makeCell(r, c));
}

function makeCell(r, c) {
  const cell = document.createElement('div');
  cell.className = 'cell';
  cell.id = `c-${r}-${c}`;
  cell.tabIndex = r === 0 && c === 0 ? 0 : -1;
  cell.setAttribute('role', 'button');
  const bd = board[r][c];
  const description = bd.revealed ? (bd.mine ? '地雷' : bd.count ? `周囲の地雷${bd.count}個` : '開いた安全マス')
    : bd.flagged ? '旗を置いたマス' : bd.question ? '未確定のマス' : '開いていないマス';
  cell.setAttribute('aria-label', `${r + 1}行${c + 1}列、${description}`);
  if (hintCell?.r === r && hintCell?.c === c && !bd.revealed) cell.classList.add('hint-suggested');

  if (bd.revealed) {
    cell.classList.add('revealed');
    if (bd.mine) {
      cell.textContent = '💣';
    } else if (bd.count > 0) {
      cell.classList.add(`n${bd.count}`);
      const span = document.createElement('span');
      span.className = 'num';
      span.textContent = bd.count;
      cell.appendChild(span);
    } else {
      cell.classList.add('empty');
      const f = FLOWERS[Math.floor((r*cfg.w+c) % FLOWERS.length)];
      cell.style.setProperty('--flower', `"${f}"`);
    }
  } else if (bd.flagged) {
    cell.classList.add('hidden', 'flagged');
  } else if (bd.question) {
    cell.classList.add('hidden', 'question');
  } else {
    cell.classList.add('hidden');
  }

  // Events - desktop
  cell.addEventListener('contextmenu', e => { e.preventDefault(); onRightClick(r, c); });

  // Touch handling (mobile)
  let tp = null;
  let touchHandled = false;

  cell.addEventListener('touchstart', e => {
    // Only track one touch at a time to prevent multi-cell issues
    if (activeTouchId !== null) return;
    const touch = e.changedTouches[0];
    activeTouchId = touch.identifier;
    touchHandled = false;

    tp = setTimeout(() => {
      tp = null;
      touchHandled = true;
      onRightClick(r, c);
      // Vibrate feedback if available
      if (navigator.vibrate) navigator.vibrate(30);
    }, 400);
  }, {passive: false});

  cell.addEventListener('touchend', e => {
    const touch = Array.from(e.changedTouches).find(t => t.identifier === activeTouchId);
    if (!touch) return;
    e.preventDefault(); // prevent subsequent click event
    activeTouchId = null;
    if (tp) {
      clearTimeout(tp); tp = null;
      // Short tap: use flag mode or normal click
      if (!touchHandled) {
        if (flagMode) {
          onRightClick(r, c);
        } else {
          onLeftClick(r, c);
        }
      }
    }
    touchHandled = false;
  }, {passive: false});

  cell.addEventListener('touchmove', e => {
    if (tp) { clearTimeout(tp); tp = null; }
  }, {passive: true});

  cell.addEventListener('touchcancel', e => {
    if (Array.from(e.changedTouches).some(t => t.identifier === activeTouchId)) activeTouchId = null;
    if (tp) { clearTimeout(tp); tp = null; }
    touchHandled = false;
  });

  // Desktop click
  cell.addEventListener('click', e => {
    if (flagMode) {
      onRightClick(r, c);
    } else {
      onLeftClick(r, c);
    }
  });

  cell.addEventListener('keydown', e => {
    const directions = { ArrowUp:[-1,0], ArrowDown:[1,0], ArrowLeft:[0,-1], ArrowRight:[0,1] };
    if (directions[e.key]) {
      e.preventDefault();
      const [dr, dc] = directions[e.key];
      const next = document.getElementById(`c-${clamp(r + dr, 0, cfg.h - 1)}-${clamp(c + dc, 0, cfg.w - 1)}`);
      if (next) { cell.tabIndex = -1; next.tabIndex = 0; next.focus(); }
    } else if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      flagMode ? onRightClick(r, c) : onLeftClick(r, c);
    } else if (e.key.toLowerCase() === 'f') {
      e.preventDefault();
      onRightClick(r, c);
    }
  });

  return cell;
}

function updateCell(r, c) {
  const old = document.getElementById(`c-${r}-${c}`);
  if (!old) return;
  const next = makeCell(r, c);
  const hadFocus = document.activeElement === old;
  next.tabIndex = old.tabIndex;
  old.replaceWith(next);
  if (hadFocus) next.focus();
}

// ============================================================
//   INPUT HANDLERS
// ============================================================
function onLeftClick(r, c) {
  if (state === 'won' || state === 'lost') return;
  const bd = board[r][c];
  if (bd.flagged || bd.question) return;

  // Chord on revealed number
  if (bd.revealed && bd.count > 0) {
    chord(r, c);
    return;
  }
  if (bd.revealed) return;

  // First click
  if (firstClick) {
    firstClick = false;
    placeMines(r, c);
  }

  clicks++;
  if (bd.mine) {
    explodeMine(r, c);
  } else {
    const before = revealedCount;
    reveal(r, c);
    recordSafeChain(before);
    checkWin();
  }
}

function onRightClick(r, c) {
  if (state === 'won' || state === 'lost') return;
  const bd = board[r][c];
  if (bd.revealed) return;

  if (!bd.flagged && !bd.question) {
    bd.flagged = true;
    flagged++;
  } else if (bd.flagged) {
    bd.flagged = false;
    bd.question = true;
    flagged--;
  } else {
    bd.question = false;
  }
  document.getElementById('hud-mines').textContent = Math.max(0, cfg.m - flagged);
  updateCell(r, c);
}

// ── Chord (right-click on number) ──
function chord(r, c) {
  const bd = board[r][c];
  const nbrs = neighbors(r, c);
  const flagCount = nbrs.filter(([nr,nc]) => board[nr][nc].flagged).length;

  if (flagCount !== bd.count) {
    // Highlight neighbors briefly
    clearChordHints();
    chordCells = nbrs.filter(([nr,nc]) => !board[nr][nc].revealed && !board[nr][nc].flagged);
    chordCells.forEach(([nr,nc]) => {
      const el = document.getElementById(`c-${nr}-${nc}`);
      if (el) el.classList.add('chord-hint');
    });
    chordTimer = setTimeout(clearChordHints, 500);
    return;
  }

  // Execute chord
  const before = revealedCount;
  let hitMine = false;
  for (const [nr, nc] of nbrs) {
    if (!board[nr][nc].revealed && !board[nr][nc].flagged) {
      if (board[nr][nc].mine) {
        hitMine = true;
        explodeMine(nr, nc);
        break;
      } else {
        reveal(nr, nc);
      }
    }
  }
  if (!hitMine) { recordSafeChain(before); checkWin(); }
}

function clearChordHints() {
  clearTimeout(chordTimer);
  chordCells.forEach(([nr,nc]) => {
    const el = document.getElementById(`c-${nr}-${nc}`);
    if (el) el.classList.remove('chord-hint');
  });
  chordCells = [];
}

// ── Flood-fill reveal ──
function reveal(r, c) {
  const bd = board[r][c];
  if (bd.revealed || bd.flagged || bd.mine) return;
  bd.revealed = true;
  revealedCount++;
  updateCell(r, c);
  if (bd.count === 0) {
    neighbors(r, c).forEach(([nr,nc]) => {
      if (!board[nr][nc].revealed) reveal(nr, nc);
    });
  }
}

// ============================================================
//   WIN / LOSE
// ============================================================
function checkWin() {
  if (state !== 'playing' || winRecorded) return;
  const total = cfg.w * cfg.h;
  const mines = cfg.m;
  if (revealedCount === total - mines) {
    winRecorded = true;
    clearInterval(timerID);
    state = 'won';
    clearHintHighlight();
    updateHintButton();
    updateProgress();
    const elapsedMs = Math.max(100, Math.round(rankingNow() - roundStartedAt));
    setFace('🥳');
    // Auto-flag remaining mines
    for (let r = 0; r < cfg.h; r++)
      for (let c = 0; c < cfg.w; c++)
        if (board[r][c].mine && !board[r][c].flagged) {
          board[r][c].flagged = true; updateCell(r, c);
        }
    document.getElementById('hud-mines').textContent = '0';

    // Update best time
    if (hintUses === 2 && ['easy','medium','hard'].includes(activeDiff)) {
      if (elapsedMs < bestTimes[activeDiff]) {
        bestTimes[activeDiff] = elapsedMs;
        updateBest();
      }
    }

    // Stars
    const ratio = clicks / (cfg.w * cfg.h - cfg.m);
    const stars = ratio <= 1.2 ? '⭐⭐⭐' : ratio <= 2 ? '⭐⭐' : '⭐';
    document.getElementById('win-stars').textContent = stars;
    document.getElementById('ws-time').textContent = `${(elapsedMs / 1000).toFixed(2)}秒`;
    document.getElementById('ws-moves').textContent = clicks;
    document.getElementById('ws-mines').textContent = cfg.m;
    document.getElementById('win-mode').textContent = hintUses < 2
      ? '💡 ヒント使用・補助ありランキングに記録します'
      : '✿ ノーヒント・通常ランキングに記録します';
    document.getElementById('win-ov').classList.add('show');
    launchConfetti();
    const result = {mode:activeRankingMode,label:'マインスイーパー',score:0,duration:elapsedMs,
      session:rankingSessionPromise,modeOptions:minesweeperModeOptions(),
      note:`${cfg.w}×${cfg.h}・地雷${cfg.m}個 / ${hintUses < 2 ? 'ヒント使用' : 'ノーヒント'}`};
    lastWinRankingResult = result;
    openMinesweeperWinRanking();
  }
}

function explodeMine(hitR, hitC) {
  clearInterval(timerID);
  state = 'lost';
  clearHintHighlight();
  updateHintButton();
  updateProgress();
  setFace('😵');

  // Show all mines
  for (let r = 0; r < cfg.h; r++)
    for (let c = 0; c < cfg.w; c++) {
      const bd = board[r][c];
      if (bd.mine && !bd.flagged && !(r===hitR && c===hitC)) {
        bd.revealed = true; updateCell(r, c);
        const el = document.getElementById(`c-${r}-${c}`);
        if (el) el.classList.add('mine-shown');
      }
      // Wrong flags
      if (bd.flagged && !bd.mine) {
        bd.revealed = true; updateCell(r, c);
        const el = document.getElementById(`c-${r}-${c}`);
        if (el) { el.textContent = '❌'; el.classList.add('mine-wrong'); }
      }
    }

  // Mark hit mine
  board[hitR][hitC].revealed = true;
  updateCell(hitR, hitC);
  const hitEl = document.getElementById(`c-${hitR}-${hitC}`);
  if (hitEl) hitEl.classList.add('mine-hit');

  // Explosion particles
  explodeParticles(hitR, hitC);

  const serial = roundSerial;
  setTimeout(() => {
    if (serial !== roundSerial || state !== 'lost') return;
    document.getElementById('ls-time').textContent = document.getElementById('hud-time').textContent;
    document.getElementById('ls-open').textContent = revealedCount;
    document.getElementById('lose-ov').classList.add('show');
  }, 700);
}

// Explosion visual effect
function explodeParticles(r, c) {
  const el = document.getElementById(`c-${r}-${c}`);
  if (!el) return;
  const rect = el.getBoundingClientRect();
  const cx = rect.left + rect.width/2, cy = rect.top + rect.height/2;
  const emojis = ['💥','🔥','⚡','💫','✨'];
  for (let i = 0; i < 12; i++) {
    const p = document.createElement('div');
    p.className = 'conf';
    p.textContent = emojis[Math.floor(Math.random()*emojis.length)];
    const ang = Math.random() * Math.PI * 2;
    const dist = 50 + Math.random() * 80;
    p.style.cssText = `left:${cx}px;top:${cy}px;position:fixed;font-size:${1+Math.random()}rem;
      --cd:0.8s;transform-origin:center;z-index:9998;
      animation:cfall .8s ease-out forwards;
      --ix:${Math.cos(ang)*dist}px;--iy:${Math.sin(ang)*dist}px;`;
    // Simple fly-out
    p.style.animation = 'none';
    p.style.transition = `transform ${0.4+Math.random()*0.3}s ease-out, opacity 0.6s ease-out`;
    p.style.opacity = '1';
    document.body.appendChild(p);
    requestAnimationFrame(() => {
      requestAnimationFrame(() => {
        p.style.transform = `translate(${Math.cos(ang)*dist}px, ${Math.sin(ang)*dist}px) rotate(${Math.random()*360}deg)`;
        p.style.opacity = '0';
      });
    });
    setTimeout(() => p.remove(), 900);
  }
}

// ============================================================
//   UI HELPERS
// ============================================================
function setFace(f) { document.getElementById('face-icon').textContent = f; }

function closeOv(id) { document.getElementById(id).classList.remove('show'); }

function updateBest() {
  const b = bestTimes[curDiff];
  const el = document.getElementById('best-disp');
  if (!['easy','medium','hard'].includes(curDiff) || b === Infinity) { el.style.display='none'; return; }
  el.style.display = 'inline-flex';
  document.getElementById('best-time').textContent = `${(b/1000).toFixed(2)}秒 (${curDiff==='easy'?'かんたん':curDiff==='medium'?'ふつう':'むずかしい'})`;
}

// ============================================================
//   CONFETTI
// ============================================================
function launchConfetti() {
  const colors = ['#e879f9','#818cf8','#38bdf8','#4ade80','#fbbf24','#f472b6','#a78bfa'];
  const emojis = ['🌸','✨','⭐','💫','🌺','🎉','💐'];
  for (let i = 0; i < 70; i++) {
    setTimeout(() => {
      const el = document.createElement('div');
      el.className = 'conf';
      if (Math.random() > 0.45) {
        el.textContent = emojis[Math.floor(Math.random()*emojis.length)];
        el.style.fontSize = (0.9 + Math.random()*0.8) + 'rem';
      } else {
        const sz = 7 + Math.random()*9;
        el.style.width = sz+'px'; el.style.height = sz+'px';
        el.style.background = colors[Math.floor(Math.random()*colors.length)];
        el.style.borderRadius = Math.random()>.5 ? '50%' : '3px';
      }
      el.style.left = Math.random()*100 + 'vw';
      el.style.top = '-25px';
      el.style.setProperty('--cd', (2+Math.random()*2.5)+'s');
      document.body.appendChild(el);
      setTimeout(() => el.remove(), 5000);
    }, i * 50);
  }
}

// ============================================================
//   KEYBOARD
// ============================================================
document.addEventListener('keydown', e => {
  if (/^(INPUT|TEXTAREA|SELECT)$/.test(e.target?.tagName) || window.TKLeaderboard?.isOpen?.()) return;
  if (e.key === 'r' || e.key === 'R') newGame();
  if (e.key === 'h' || e.key === 'H') useHint();
  if (e.key === 'Escape') {
    document.getElementById('win-ov').classList.remove('show');
    document.getElementById('lose-ov').classList.remove('show');
  }
});

// ============================================================
//   START
// ============================================================
newGame();
</script>
